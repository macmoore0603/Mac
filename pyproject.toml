[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nqcopilot"
version = "1.0.0"
description = "Intraday Nasdaq futures copilot with hard Apex account-rule enforcement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# No runtime dependencies, by design: fewer moving parts on something that sits
# next to a funded account, and it runs on a stock Python install.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nqcopilot = "nqcopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
